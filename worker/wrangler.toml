name = "tw-rotation-radar-intraday"
main = "src/index.js"
compatibility_date = "2026-01-01"

# 免費層：Cron 最短 1 分鐘。程式內再判斷「台北 09:00–13:30 且為交易日」才實抓，
# 其餘時間直接 return，不浪費額度。
[triggers]
crons = ["* * * * *"]

# KV：只存「原始最新價」JSON。id 由 `wrangler kv namespace create QUOTES` 產生後填入。
[[kv_namespaces]]
binding = "QUOTES"
id = "REPLACE_WITH_KV_ID"

[vars]
# 盤中視窗（UTC）＝台北 09:00–13:30
UTC_START_MIN = "60"    # 01:00 UTC
UTC_END_MIN   = "330"   # 05:30 UTC
