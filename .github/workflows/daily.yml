name: daily

# 排程用 UTC。台北 = UTC+8。
#   17:50 台北 = 09:50 UTC  → 主跑
#   19:30 台北 = 11:30 UTC  → 補跑（先查當日是否已完成，完成即退出——冪等）
on:
  schedule:
    - cron: '50 9 * * 1-5'
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    inputs:
      test_telegram:
        description: '成功後補發一則測試通知到 Telegram（只有手動觸發才會發，排程不發）'
        type: boolean
        default: true

concurrency:
  group: daily-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
  HC_PING_URL_DAILY:    ${{ secrets.HC_PING_URL_DAILY }}
  FINMIND_TOKEN:        ${{ secrets.FINMIND_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝相依
        run: pip install --quiet pandas numpy

      - name: run_id 與現況（L0 冪等基準）
        id: guard
        run: |
          RUN_ID=$(TZ=Asia/Taipei date +%F)
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "今日(台北) = $RUN_ID"

      # 只印「有沒有設、長度、sha256 指紋」，永不印值或值的任何子字串。
      # Telegram 另打一次 getMe，真的驗證 token 有效（不只是「有設定」）。
      # 不擋管線：缺 token 的紀律一直是「優雅跳過」，不是讓整條線倒下。
      - name: Secrets 自檢（masked，永不印全值）
        continue-on-error: true
        run: python scripts/notify.py mask

      - name: L7 休市日曆檢查（TWSE 官方）
        id: cal
        run: python scripts/holidays.py

      - name: 單元測試（公式凍結護欄）
        run: python scripts/test_twrrg.py
      - name: 單元測試失敗 → 告警
        if: failure()
        run: python scripts/notify.py fail "${{ steps.guard.outputs.run_id }}" "單元測試" "公式護欄測試未通過"

      - name: 每日增量 + 完整性閘門
        id: fetch
        run: python scripts/fetch_daily.py

      - name: 閘門/抓取失敗 → 告警（保留上一版成功的 docs/）
        if: failure() && steps.fetch.outcome == 'failure'
        run: |
          git checkout -- docs/ data/ || true
          python scripts/notify.py fail "${{ steps.guard.outputs.run_id }}" "每日增量/完整性閘門" \
            "不發布，已保留上一版成功的 docs/。詳見 Actions 日誌。"

      - name: 重算 history.json
        run: python scripts/build_history.py

      - name: 發布（僅在【資料】真的變動時 commit）
        id: publish
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # history.json 內含 generated_at，每次重算都會變；只看它會導致每跑必 commit。
          # 以 data/prices.csv（真資料）為唯一判準。
          if git diff --quiet -- data/prices.csv; then
            echo "prices.csv 無變動（非交易日／今日已完成）→ 不發布。"
            git checkout -- docs/history.json || true
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            git add data/prices.csv docs/history.json
            git commit -m "daily: ${{ steps.guard.outputs.run_id }} 收盤定稿"
            git push
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # 盤中即時層的告警需要 Cloudflare Worker 上的 secret，而那兩個目前都沒設。
      # 這一步在「本來就有 Telegram secret」的 Actions 裡補上事後檢查：
      # 交易日卻整天沒資料、或已退回 60 秒模式，都會有人被通知，不必靠有人剛好開網頁看。
      # 純觀測，continue-on-error：盤中層的狀況不該讓日線管線變紅。
      - name: L6 盤中即時層事後檢查
        continue-on-error: true
        run: python scripts/check_intraday.py

      - name: L4 成功心跳（最後一步；沒有 ping 就是事故）
        if: success()
        run: python scripts/notify.py ping daily

      # 只有手動觸發且勾選才發。排程跑【不會】發成功通知——
      # 每天一則「今天沒事」的訊息會讓人很快學會無視它，
      # 真的出事那則就跟著被無視了。日常靠 Healthchecks 的「沒收到就叫」。
      - name: 測試通知（僅手動觸發）
        if: success() && github.event_name == 'workflow_dispatch' && inputs.test_telegram
        run: |
          python scripts/notify.py ok "${{ steps.guard.outputs.run_id }}" \
            "測試通知：三個 Secret 已接上並驗證通過。發布=${{ steps.publish.outputs.published }}。收到這則代表失敗告警管道可用。"

      - name: 任一步驟失敗 → 心跳報失敗 + Telegram
        if: failure()
        run: |
          python scripts/notify.py ping daily /fail
          python scripts/notify.py fail "${{ steps.guard.outputs.run_id }}" "workflow" "見 Actions 日誌"
